name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            name: mac-arm64
          - os: windows-latest
            name: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps (mac)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          pip install numpy

      - name: Install test deps (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $bin = (Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          echo "$bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "FFMPEG_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          pip install numpy

      - name: Build engine
        run: |
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build --config Release --parallel

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Engine tests
        shell: bash
        run: |
          ENGINE=$PWD/engine/build/syncu-engine
          [ -f engine/build/Release/syncu-engine.exe ] && ENGINE=$PWD/engine/build/Release/syncu-engine.exe
          # Git Bash paths (/d/a/...) mean nothing to native Windows programs.
          if command -v cygpath >/dev/null; then ENGINE=$(cygpath -w "$ENGINE"); fi
          echo "ENGINE=$ENGINE" >> $GITHUB_ENV
          SYNCU_ENGINE=$ENGINE SYNCU_TEST_MEDIA=$RUNNER_TEMP/syncu-media python engine/tests/run_tests.py

      - name: Planner tests
        run: node plugin/tests/plan.test.js

      - name: Panel simulation (mock Premiere + real helper)
        shell: bash
        run: |
          cd plugin/tests/sim && npm install --no-audit --no-fund --silent
          # Each way Premiere might handle sub-frame audio edits.
          for m in clone move none; do
            MOCK_SUBFRAME=$m node run-sim.js "$RUNNER_TEMP/syncu-media" "$ENGINE"
          done

      - name: Upload simulation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-report-${{ matrix.name }}
          path: ${{ runner.temp }}/syncu-media/sim-report.txt
          if-no-files-found: ignore

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/Syncu/helper
          cp -R plugin dist/Syncu/plugin
          rm -rf dist/Syncu/plugin/tests
          cp scripts/* dist/Syncu/
          cp README.md dist/Syncu/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp engine/build/Release/syncu-engine.exe dist/Syncu/helper/
            cp "$FFMPEG_BIN/ffmpeg.exe" dist/Syncu/helper/
          else
            cp engine/build/syncu-engine dist/Syncu/helper/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Syncu-${{ matrix.name }}
          path: dist/Syncu

  # Every push to main publishes a GitHub release for the version in
  # plugin/manifest.json; the panel's Update button installs from it.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: Syncu-*
          path: artifacts

      - name: Package release
        run: |
          VER=$(python3 -c "import json;print(json.load(open('plugin/manifest.json'))['version'])")
          echo "VER=$VER" >> $GITHUB_ENV
          # The panel as an installable .ccx (a zip of the plugin folder).
          (cd plugin && zip -qr ../syncu.ccx . -x 'tests/*')
          mkdir -p release
          for name in mac-arm64 win-x64; do
            rm -rf stage && mkdir -p stage
            cp -R "artifacts/Syncu-$name" stage/Syncu
            cp syncu.ccx stage/Syncu/
            chmod +x stage/Syncu/*.command stage/Syncu/helper/* 2>/dev/null || true
            (cd stage && zip -qr "../release/Syncu-$name.zip" Syncu)
          done
          ls -l release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VER"
          NOTES="Syncu $VER ($(git rev-parse --short HEAD)). First install: unzip, then run install-mac.command (Mac) or install-windows.ps1 (Windows). Already installed: use the Update button in the panel."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.zip --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" release/*.zip --title "Syncu $VER" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
